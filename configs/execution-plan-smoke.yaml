schema_version: 1
tasks:
  - task_id: gpu-preflight
    objective: Verify the exact approved four-RTX-3090 runtime before loading weights.
    command: [python, scripts/gpu_preflight.py, --output, runs/smoke/preflight.json]
    validation_command: [python, scripts/validate_artifact.py, preflight, runs/smoke/preflight.json]
    inputs: []
    outputs: [runs/smoke/preflight.json]
    dependencies: []
    estimated_gpu_hours: 0.01
    estimated_storage_gb: 0.001
    failure_behavior: terminal

  - task_id: dataset-freeze
    objective: Resolve immutable dataset revisions, normalize records, audit leakage, and freeze membership.
    command: [reverse-reap, fetch-datasets, configs/dataset-sources.yaml, datasets/manifests/full.jsonl]
    validation_command: [python, scripts/validate_artifact.py, dataset, datasets/manifests/full.jsonl]
    inputs: [configs/dataset-sources.yaml]
    outputs: [datasets/manifests/full.jsonl, datasets/manifests/full.sources.json]
    dependencies: []
    estimated_gpu_hours: 0
    estimated_storage_gb: 2
    failure_behavior: terminal

  - task_id: instrumentation-probe
    objective: Prove capture leaves logits byte-exact and records top-8 routes across all 40 layers.
    command: [reverse-reap, probe, configs/smoke-3090-bf16.yaml, /models/qwen, --output, runs/smoke/probe.json]
    validation_command: [python, scripts/validate_artifact.py, probe, runs/smoke/probe.json]
    inputs: [configs/smoke-3090-bf16.yaml]
    outputs: [runs/smoke/probe.json]
    dependencies: [gpu-preflight]
    estimated_gpu_hours: 0.25
    estimated_storage_gb: 0.1
    failure_behavior: terminal

  - task_id: telemetry-smoke
    objective: Capture streaming prompt, completion, and joint REAP statistics for twenty samples.
    command: [reverse-reap, capture, configs/smoke-3090-bf16.yaml, /models/qwen, datasets/manifests/full.jsonl, runs/smoke/telemetry.jsonl, --split, all, --limit, "20"]
    validation_command: [reverse-reap, validate-telemetry, runs/smoke/telemetry.jsonl, --output, runs/smoke/telemetry-validation.json]
    inputs: [configs/smoke-3090-bf16.yaml, datasets/manifests/full.jsonl]
    outputs: [runs/smoke/telemetry.jsonl, runs/smoke/telemetry-validation.json]
    dependencies: [instrumentation-probe, dataset-freeze]
    estimated_gpu_hours: 1.5
    estimated_storage_gb: 1
    failure_behavior: retry

  - task_id: candidate-analysis
    objective: Rank coding differential experts, run bootstrap and permutation tests, and freeze candidates and controls.
    command: [reverse-reap, analyze, runs/smoke/telemetry.jsonl, runs/smoke/analysis, --top-n, "8", --bootstrap-iterations, "200", --permutation-iterations, "200"]
    validation_command: [python, scripts/validate_artifact.py, candidate, runs/smoke/analysis/candidate-manifest.json]
    inputs: [runs/smoke/telemetry.jsonl]
    outputs: [runs/smoke/analysis/candidate-manifest.json, runs/smoke/analysis/bootstrap-stability.json, runs/smoke/analysis/label-permutation.json, runs/smoke/analysis/control-manifests.json]
    dependencies: [telemetry-smoke]
    estimated_gpu_hours: 0
    estimated_storage_gb: 1
    failure_behavior: terminal

  - task_id: baseline-validation
    objective: Establish an intact deterministic validation baseline on scoreable frozen items.
    command: [reverse-reap, evaluate, configs/smoke-3090-bf16.yaml, /models/qwen, datasets/manifests/full.jsonl, runs/smoke/baseline-validation.jsonl, --split, validation, --condition-id, C0, --evaluator-image, "${REVERSE_REAP_EVALUATOR_IMAGE}", --limit, "20"]
    validation_command: [python, scripts/validate_artifact.py, dataset, runs/smoke/baseline-validation.jsonl]
    inputs: [configs/smoke-3090-bf16.yaml, datasets/manifests/full.jsonl]
    outputs: [runs/smoke/baseline-validation.jsonl]
    dependencies: [instrumentation-probe, dataset-freeze]
    estimated_gpu_hours: 0.75
    estimated_storage_gb: 1
    failure_behavior: retry

  - task_id: selected-ablation-validation
    objective: Evaluate the frozen candidate set with zero contribution and no router renormalization.
    command: [reverse-reap, evaluate, configs/smoke-3090-bf16.yaml, /models/qwen, datasets/manifests/full.jsonl, runs/smoke/selected-validation.jsonl, --split, validation, --condition-id, C2, --evaluator-image, "${REVERSE_REAP_EVALUATOR_IMAGE}", --expert-manifest, runs/smoke/analysis/candidate-manifest.json, --limit, "20"]
    validation_command: [python, scripts/validate_artifact.py, dataset, runs/smoke/selected-validation.jsonl]
    inputs: [configs/smoke-3090-bf16.yaml, datasets/manifests/full.jsonl, runs/smoke/analysis/candidate-manifest.json]
    outputs: [runs/smoke/selected-validation.jsonl]
    dependencies: [candidate-analysis, baseline-validation]
    estimated_gpu_hours: 0.75
    estimated_storage_gb: 1
    failure_behavior: retry

  - task_id: extract-candidates
    objective: Extract every frozen candidate tensor and independently prove byte equality.
    command: [reverse-reap, extract, configs/smoke-3090-bf16.yaml, /models/qwen, runs/smoke/analysis/candidate-manifest.json, runs/smoke/extraction]
    validation_command: [python, scripts/validate_artifact.py, extraction, runs/smoke/extraction/extraction-manifest.json]
    inputs: [configs/smoke-3090-bf16.yaml, runs/smoke/analysis/candidate-manifest.json]
    outputs: [runs/smoke/extraction/extraction-manifest.json, runs/smoke/extraction/experts.safetensors]
    dependencies: [candidate-analysis]
    estimated_gpu_hours: 0.1
    estimated_storage_gb: 10
    failure_behavior: terminal
