  # container-capable scoring host and is NOT booked against this budget.
  max_gpu_hours: 3
  max_cost_usd: 4.8
  provider_rate_usd_per_hour: 1.6
  storage_limit_gb: 120
  deadline_utc: 2026-12-31T00:00:00Z
