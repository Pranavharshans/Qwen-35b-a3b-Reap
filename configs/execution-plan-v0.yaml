schema_version: 1
tasks:
- task_id: gpu-preflight
  objective: Verify the approved four-RTX-3090 execution environment.
  definition_of_done: Hardware report passes exact count, model, memory, capability, and disk checks.
  command:
  - python
  - scripts/gpu_preflight.py
  - --output
  - runs/v0/${RUN_ID}/preflight.json
  validation_command:
  - python
  - scripts/validate_artifact.py
  - preflight
  - runs/v0/${RUN_ID}/preflight.json
  inputs: []
  outputs:
  - runs/v0/${RUN_ID}/preflight.json
  dependencies: []
  estimated_gpu_hours: 0.01
  estimated_storage_gb: 1.0
  failure_behavior: terminal
  run_if: null
- task_id: dataset-freeze
  objective: Resolve, normalize, audit, and freeze all coding and control sources.
  definition_of_done: At least 500 coding and 500 control rows are immutable with source provenance.
  command:
  - reverse-reap
  - fetch-datasets
  - configs/dataset-sources.yaml
  - datasets/manifests/full.jsonl
  validation_command:
  - python
  - scripts/validate_dataset.py
  - datasets/manifests/full.jsonl
  - --full
  inputs:
  - configs/dataset-sources.yaml
  outputs:
  - datasets/manifests/full.jsonl
  - datasets/manifests/full.sources.json
  dependencies: []
  estimated_gpu_hours: 0.0
  estimated_storage_gb: 3.0
  failure_behavior: terminal
  run_if: null
- task_id: dataset-token-length-audit
  objective: Measure exact Qwen-tokenizer prompt lengths before attribution.
  definition_of_done: Coding/control median, tail, and truncation balance gates pass.
  command:
  - reverse-reap
  - audit-token-lengths
  - datasets/manifests/full.jsonl
  - /models/qwen
  - runs/v0/${RUN_ID}/dataset-token-lengths.json
  - --max-input-tokens
  - '1024'
  validation_command:
  - python
  - scripts/validate_artifact.py
  - dataset-lengths
  - runs/v0/${RUN_ID}/dataset-token-lengths.json
  inputs:
  - datasets/manifests/full.jsonl
  outputs:
  - runs/v0/${RUN_ID}/dataset-token-lengths.json
  dependencies:
  - dataset-freeze
  - gpu-preflight
  estimated_gpu_hours: 0.0
  estimated_storage_gb: 1.0
  failure_behavior: terminal
  run_if: null
- task_id: instrumentation-probe
  objective: Prove exact Qwen routing capture and no-op behavioral equivalence.
  definition_of_done: Exact logits, routed row count, and architecture contract all pass.
  command:
  - reverse-reap
  - probe
  - configs/pinned-3090-bf16.yaml
  - /models/qwen
  - --output
  - runs/v0/${RUN_ID}/probe.json
  validation_command:
  - python
  - scripts/validate_artifact.py
  - probe
  - runs/v0/${RUN_ID}/probe.json
  inputs:
  - configs/pinned-3090-bf16.yaml
  outputs:
  - runs/v0/${RUN_ID}/probe.json
  dependencies:
  - gpu-preflight
  estimated_gpu_hours: 0.5
  estimated_storage_gb: 1.0
  failure_behavior: terminal
  run_if: null
- task_id: telemetry-calibration
  objective: Capture token-level streaming REAP telemetry for frozen calibration rows.
  definition_of_done: Every token-layer group has exactly eight unique finite routed expert rows.
  command:
  - reverse-reap
  - capture
  - configs/pinned-3090-bf16.yaml
  - /models/qwen
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/telemetry-calibration.jsonl
  - --split
  - calibration
  validation_command:
  - reverse-reap
  - validate-telemetry
  - runs/v0/${RUN_ID}/telemetry-calibration.jsonl
  - --output
  - runs/v0/${RUN_ID}/telemetry-calibration-validation.json
  inputs:
  - configs/pinned-3090-bf16.yaml
  - datasets/manifests/full.jsonl
  outputs:
  - runs/v0/${RUN_ID}/telemetry-calibration.jsonl
  - runs/v0/${RUN_ID}/telemetry-calibration-validation.json
  dependencies:
  - instrumentation-probe
  - dataset-freeze
  - dataset-token-length-audit
  estimated_gpu_hours: 12.0
  estimated_storage_gb: 30.0
  failure_behavior: retry
  run_if: null
- task_id: telemetry-selection
  objective: Capture token-level streaming REAP telemetry for frozen selection rows.
  definition_of_done: Every token-layer group has exactly eight unique finite routed expert rows.
  command:
  - reverse-reap
  - capture
  - configs/pinned-3090-bf16.yaml
  - /models/qwen
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/telemetry-selection.jsonl
  - --split
  - selection
  validation_command:
  - reverse-reap
  - validate-telemetry
  - runs/v0/${RUN_ID}/telemetry-selection.jsonl
  - --output
  - runs/v0/${RUN_ID}/telemetry-selection-validation.json
  inputs:
  - configs/pinned-3090-bf16.yaml
  - datasets/manifests/full.jsonl
  outputs:
  - runs/v0/${RUN_ID}/telemetry-selection.jsonl
  - runs/v0/${RUN_ID}/telemetry-selection-validation.json
  dependencies:
  - instrumentation-probe
  - dataset-freeze
  - dataset-token-length-audit
  estimated_gpu_hours: 12.0
  estimated_storage_gb: 30.0
  failure_behavior: retry
  run_if: null
- task_id: merge-telemetry
  objective: Merge only calibration and selection routing chunks without duplicate identities.
  definition_of_done: Merged telemetry validates and contains no validation or replication samples.
  command:
  - reverse-reap
  - merge-telemetry
  - runs/v0/${RUN_ID}/telemetry.jsonl
  - runs/v0/${RUN_ID}/telemetry-calibration.jsonl
  - runs/v0/${RUN_ID}/telemetry-selection.jsonl
  validation_command:
  - reverse-reap
  - validate-telemetry
  - runs/v0/${RUN_ID}/telemetry.jsonl
  inputs:
  - runs/v0/${RUN_ID}/telemetry-calibration.jsonl
  - runs/v0/${RUN_ID}/telemetry-selection.jsonl
  outputs:
  - runs/v0/${RUN_ID}/telemetry.jsonl
  dependencies:
  - telemetry-calibration
  - telemetry-selection
  estimated_gpu_hours: 0.0
  estimated_storage_gb: 60.0
  failure_behavior: terminal
  run_if: null
- task_id: candidate-analysis
  objective: Compute differential ranking, uncertainty, permutations, and frozen controls.
  definition_of_done: Gate C decision and all selected/random/frequency/negative manifests are hashed.
  command:
  - reverse-reap
  - analyze
  - runs/v0/${RUN_ID}/telemetry.jsonl
  - runs/v0/${RUN_ID}/analysis
  - --top-n
  - '32'
  - --cardinality-grid
  - '8'
  - '16'
  - '32'
  - '64'
  validation_command:
  - python
  - scripts/validate_artifact.py
  - candidate
  - runs/v0/${RUN_ID}/analysis/candidate-manifest.json
  inputs:
  - runs/v0/${RUN_ID}/telemetry.jsonl
  outputs:
  - runs/v0/${RUN_ID}/analysis/candidate-manifest.json
  - runs/v0/${RUN_ID}/analysis/bootstrap-stability.json
  - runs/v0/${RUN_ID}/analysis/label-permutation.json
  - runs/v0/${RUN_ID}/analysis/control-manifests.json
  - runs/v0/${RUN_ID}/analysis/cardinality-grid.json
  dependencies:
  - merge-telemetry
  estimated_gpu_hours: 0.0
  estimated_storage_gb: 2.0
  failure_behavior: terminal
  run_if: null
- task_id: single-expert-intervention-probe
  objective: Prove one routed candidate can be zeroed with exact no-op semantics.
  definition_of_done: A routed real-donor sample has bit-exact no-op logits and changed masked logits.
  command:
  - reverse-reap
  - probe-intervention
  - configs/pinned-3090-bf16.yaml
  - /models/qwen
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/analysis/candidate-manifest.json
  - runs/v0/${RUN_ID}/intervention-probe.json
  validation_command:
  - python
  - scripts/validate_artifact.py
  - probe
  - runs/v0/${RUN_ID}/intervention-probe.json
  inputs:
  - configs/pinned-3090-bf16.yaml
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/analysis/candidate-manifest.json
  outputs:
  - runs/v0/${RUN_ID}/intervention-probe.json
  dependencies:
  - candidate-analysis
  estimated_gpu_hours: 0.5
  estimated_storage_gb: 1.0
  failure_behavior: retry
  run_if:
    path: runs/v0/${RUN_ID}/analysis/candidate-manifest.json
    field: gate_passed
    equals: true
- task_id: baseline-validation-a
  objective: Run the intact C0 validation baseline for exact repeatability.
  definition_of_done: All validation rows have explicit scores/errors and the output is immutable.
  command:
  - reverse-reap
  - evaluate
  - configs/pinned-3090-bf16.yaml
  - /models/qwen
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/baseline-validation-a.jsonl
  - --split
  - validation
  - --condition-id
  - C0
  - --evaluator-image
  - ${REVERSE_REAP_EVALUATOR_IMAGE}
  validation_command:
  - python
  - scripts/validate_artifact.py
  - dataset
  - runs/v0/${RUN_ID}/baseline-validation-a.jsonl
  inputs:
  - configs/pinned-3090-bf16.yaml
  - datasets/manifests/full.jsonl
  outputs:
  - runs/v0/${RUN_ID}/baseline-validation-a.jsonl
  dependencies:
  - instrumentation-probe
  - dataset-freeze
  estimated_gpu_hours: 8.0
  estimated_storage_gb: 3.0
  failure_behavior: retry
  run_if: null
- task_id: baseline-validation-b
  objective: Run the intact C0 validation baseline for exact repeatability.
  definition_of_done: All validation rows have explicit scores/errors and the output is immutable.
