  failure_behavior: retry
  run_if: null
- task_id: baseline-determinism
  objective: Prove Gate B scoreability and exact repeated C0 responses.
  definition_of_done: At least 95 percent are scoreable and no repeated response/score differs.
  command:
  - reverse-reap
  - compare-evaluations
  - runs/v0/${RUN_ID}/baseline-validation-a.jsonl
  - runs/v0/${RUN_ID}/baseline-validation-b.jsonl
  - --output
  - runs/v0/${RUN_ID}/baseline-determinism.json
  validation_command:
  - python
  - scripts/validate_artifact.py
  - probe
  - runs/v0/${RUN_ID}/baseline-determinism.json
  inputs:
  - runs/v0/${RUN_ID}/baseline-validation-a.jsonl
  - runs/v0/${RUN_ID}/baseline-validation-b.jsonl
  outputs:
  - runs/v0/${RUN_ID}/baseline-determinism.json
  dependencies:
  - baseline-validation-a
  - baseline-validation-b
  estimated_gpu_hours: 0.0
  estimated_storage_gb: 1.0
  failure_behavior: terminal
  run_if: null
- task_id: selected-validation
  objective: Measure the frozen selected-set C2 causal intervention on validation data.
  definition_of_done: Paired selected-set results exist for the unchanged validation membership.
  command:
  - reverse-reap
  - evaluate
  - configs/pinned-3090-bf16.yaml
  - /models/qwen
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/selected-validation.jsonl
  - --split
  - validation
  - --condition-id
  - C2
  - --evaluator-image
  - ${REVERSE_REAP_EVALUATOR_IMAGE}
  - --expert-manifest
  - runs/v0/${RUN_ID}/analysis/candidate-manifest.json
  validation_command:
  - python
  - scripts/validate_artifact.py
  - dataset
  - runs/v0/${RUN_ID}/selected-validation.jsonl
  inputs:
  - configs/pinned-3090-bf16.yaml
  - datasets/manifests/full.jsonl
  - runs/v0/${RUN_ID}/analysis/candidate-manifest.json
  outputs:
  - runs/v0/${RUN_ID}/selected-validation.jsonl
  dependencies:
  - single-expert-intervention-probe
  - baseline-determinism
  estimated_gpu_hours: 8.0
  estimated_storage_gb: 3.0
  failure_behavior: retry
  run_if:
    path: runs/v0/${RUN_ID}/analysis/candidate-manifest.json
    field: gate_passed
    equals: true
- task_id: layer-random-000
