# Causal-validation pilot — PHASE 1 OF 2: GPU GENERATION on 1x RTX PRO 6000 (B8).
# Executes on the rented RTX PRO 6000 96GB host under
# configs/pinned-pro6000-bf16-gen.yaml with the B8-qualified production path
# (scripts/run_causal_conditions_batched.py: deterministic manifest-order
# chunks of 8 under the optimized intervene_qwen35 path, atomic per-chunk
# checkpoints, per-chunk heartbeats, complete package/driver fingerprint).
#
# Frozen science is UNCHANGED from the 4x3090 gen plan
# (configs/execution-plan-causal-gen.yaml, PRESERVED UNCHANGED for provenance
# and never launched on this platform): same 26 frozen conditions, same 50
# validation samples (1300 generations), same donor revision/BF16/decoding/
# thresholds/scoring. Governed deviations (human-approved): torch 2.11.0+cu128
# (sm_120 requires it), batch_size 8 (benchmark-qualified, re-gated here),
# single-GPU host-hour budget, 150 GB disk.
#
# Run scoping: launch with a fresh run ID and a run-ID-scoped state dir, e.g.
#   RUN_ID=$(python -c "from reverse_reap.config import load_config; ...")
#   reverse-reap run-all configs/pinned-pro6000-bf16-gen.yaml \
#       configs/execution-plan-causal-pro6000.yaml runs/causal-pilot/state/${RUN_ID}
# or via scripts/launch_causal_phase.py --config ... --plan ... --state-root ...
#
# Early stopping (fail-closed, none result-conditional):
#   - verify-frozen-inputs and gpu-preflight are terminal and precede all GPU work;
#   - response-determinism-pre-gate is terminal: any baseline-pair or no-op
#     equivalence mismatch stops the run after 150 of 1,300 generations,
#     before ANY intervention or control generation;
#   - all 26 conditions run regardless of interim pass rates; interim results
#     are never inspected for decision-making mid-run.
#
# Budget: booked generation estimates sum to 3.61 single-GPU host wall-hours
# (usable 6.4 h / $8.00 under the 80% controller reserve of the gen config's
# max_gpu_hours 8 / max_cost_usd 10 at $1.0817/h). Scoring work books ZERO
# GPU-host hours. Conservative projection from the B8 benchmark sel-int arm
# (7.881 spm): 1300 gens = 2.75 h + setup burn, well within ceilings.
#
# Phase 2 hand-off: generation-bundle.json pins the SHA-256 of all 26 response
# files. Only hashed manifests and response artifacts are copied to the scoring
# VM, where the score plan's verify-generation-inputs task re-checks every pin
# before any scoring starts.
schema_version: 1
tasks:
  - task_id: verify-frozen-inputs
    objective: Enforce byte-identity of all 23 frozen expert manifests against the SHA-256 pins recorded in the conditions spec.
    definition_of_done: Every referenced candidate/control manifest hash-matches the frozen pilot analysis artifacts; verification report written.
    command: [timeout, --kill-after=60, "600", python, scripts/verify_frozen_experts.py, --conditions, configs/causal-pilot-conditions.json, --report, "runs/causal-pilot/${RUN_ID}/verify-frozen-inputs.json"]
    validation_command: [python, -c, "import json,sys; r=json.load(open(sys.argv[1])); assert r['verified_manifests']==23 and r['mismatches']==[]", "runs/causal-pilot/${RUN_ID}/verify-frozen-inputs.json"]
    inputs: [configs/causal-pilot-conditions.json]
    outputs: ["runs/causal-pilot/${RUN_ID}/verify-frozen-inputs.json"]
    dependencies: []
    estimated_gpu_hours: 0
    estimated_storage_gb: 0.001
    failure_behavior: terminal

  - task_id: gpu-preflight
    objective: Verify the exact approved single-RTX-PRO-6000 runtime (sm_120, torch 2.11+cu128, disk) before loading weights.
    definition_of_done: Preflight report passes the pro6000 profile gates (1 GPU, PRO 6000 name, >=90 GiB VRAM, capability >=12.0, torch 2.11.x+cu128, >=20 GiB free disk with weights pre-staged).
    command: [timeout, --kill-after=60, "900", python, scripts/gpu_preflight.py, --profile, pro6000, --output, "runs/causal-pilot/${RUN_ID}/preflight.json"]
    validation_command: [python, scripts/validate_artifact.py, preflight, "runs/causal-pilot/${RUN_ID}/preflight.json"]
    inputs: []
    outputs: ["runs/causal-pilot/${RUN_ID}/preflight.json"]
    dependencies: []
    estimated_gpu_hours: 0.01
    estimated_storage_gb: 0.001
    failure_behavior: terminal

  - task_id: gen-validation-baselines
    objective: Generate responses for the two identical no-expert baselines and the empty-mask no-op intervention condition (3 x 50 = 150 generations, one model load, deterministic B8 chunks).
    definition_of_done: All 3 generation files exist, non-empty, produced under identical config in manifest-order B8 chunks with atomic per-chunk checkpoints and heartbeats.
    command: [timeout, --kill-after=60, "2400", python, scripts/run_causal_conditions_batched.py, --config, configs/pinned-pro6000-bf16-gen.yaml, --model-path, /models/qwen, --dataset-manifest, datasets/manifests/pilot-lengthmatched.jsonl, --conditions, configs/causal-pilot-conditions.json, --phase, validation-baselines, --output-dir, "runs/causal-pilot/${RUN_ID}/generations", --summary-dir, "runs/causal-pilot/${RUN_ID}/summaries", --checkpoint-dir, "runs/causal-pilot/${RUN_ID}/checkpoints", --heartbeat-path, "runs/causal-pilot/${RUN_ID}/heartbeat.json", --fingerprint-path, "runs/causal-pilot/${RUN_ID}/environment/fingerprint-baselines.json", --run-id, "${RUN_ID}"]
    validation_command: [python, -c, "import json,os,sys; spec=json.load(open(sys.argv[1])); phase=sys.argv[2]; d=sys.argv[3]; missing=[c['condition_id'] for c in spec['conditions'] if c['phase']==phase and not (os.path.isfile(os.path.join(d,c['condition_id']+'.jsonl')) and os.path.getsize(os.path.join(d,c['condition_id']+'.jsonl'))>0)]; assert not missing, missing", configs/causal-pilot-conditions.json, validation-baselines, "runs/causal-pilot/${RUN_ID}/generations"]
    inputs: [configs/causal-pilot-conditions.json, configs/pinned-pro6000-bf16-gen.yaml, datasets/manifests/pilot-lengthmatched.jsonl]
    outputs: ["runs/causal-pilot/${RUN_ID}/generations/c0-baseline-a.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c0-baseline-b.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c0-noop-masked.jsonl"]
    dependencies: [gpu-preflight, verify-frozen-inputs]
    estimated_gpu_hours: 0.6
    estimated_storage_gb: 0.05
    failure_behavior: retry

  - task_id: response-determinism-pre-gate
    objective: Stop before ANY intervention/control generation unless the baseline pair is byte-deterministic AND the empty-mask instrumentation is a response-identical no-op.
    definition_of_done: Zero response mismatches in c0-baseline-a vs c0-baseline-b and in c0-noop-masked vs c0-baseline-a across all 50 paired samples each; report written.
    command: [timeout, --kill-after=60, "600", python, scripts/check_generation_determinism.py, --pair, "baseline_pair=runs/causal-pilot/${RUN_ID}/generations/c0-baseline-a.jsonl:runs/causal-pilot/${RUN_ID}/generations/c0-baseline-b.jsonl", --pair, "noop_equivalence=runs/causal-pilot/${RUN_ID}/generations/c0-noop-masked.jsonl:runs/causal-pilot/${RUN_ID}/generations/c0-baseline-a.jsonl", --report, "runs/causal-pilot/${RUN_ID}/gates/pre-determinism-report.json"]
    validation_command: [python, -c, "import json,sys; r=json.load(open(sys.argv[1])); assert r['passed'] and set(r['checks'])=={'baseline_pair','noop_equivalence'} and all(not c['mismatched_sample_ids'] for c in r['checks'].values())", "runs/causal-pilot/${RUN_ID}/gates/pre-determinism-report.json"]
    inputs: ["runs/causal-pilot/${RUN_ID}/generations/c0-baseline-a.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c0-baseline-b.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c0-noop-masked.jsonl"]
    outputs: ["runs/causal-pilot/${RUN_ID}/gates/pre-determinism-report.json"]
    dependencies: [gen-validation-baselines]
    estimated_gpu_hours: 0
    estimated_storage_gb: 0.001
    failure_behavior: terminal

  - task_id: gen-validation-interventions
    objective: Generate responses for the frozen top-4 selected condition and the two specificity controls (3 x 50 = 150 generations, one model load, deterministic B8 chunks), only after the pre-gate approved batched in-condition generation.
    definition_of_done: All 3 generation files exist, non-empty.
    command: [timeout, --kill-after=60, "2400", python, scripts/run_causal_conditions_batched.py, --config, configs/pinned-pro6000-bf16-gen.yaml, --model-path, /models/qwen, --dataset-manifest, datasets/manifests/pilot-lengthmatched.jsonl, --conditions, configs/causal-pilot-conditions.json, --phase, validation-interventions, --output-dir, "runs/causal-pilot/${RUN_ID}/generations", --summary-dir, "runs/causal-pilot/${RUN_ID}/summaries", --checkpoint-dir, "runs/causal-pilot/${RUN_ID}/checkpoints", --heartbeat-path, "runs/causal-pilot/${RUN_ID}/heartbeat.json", --fingerprint-path, "runs/causal-pilot/${RUN_ID}/environment/fingerprint-interventions.json", --run-id, "${RUN_ID}"]
    validation_command: [python, -c, "import json,os,sys; spec=json.load(open(sys.argv[1])); phase=sys.argv[2]; d=sys.argv[3]; missing=[c['condition_id'] for c in spec['conditions'] if c['phase']==phase and not (os.path.isfile(os.path.join(d,c['condition_id']+'.jsonl')) and os.path.getsize(os.path.join(d,c['condition_id']+'.jsonl'))>0)]; assert not missing, missing", configs/causal-pilot-conditions.json, validation-interventions, "runs/causal-pilot/${RUN_ID}/generations"]
    inputs: [configs/causal-pilot-conditions.json, configs/pinned-pro6000-bf16-gen.yaml, datasets/manifests/pilot-lengthmatched.jsonl]
    outputs: ["runs/causal-pilot/${RUN_ID}/generations/c2-selected.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c4-frequency-matched.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c5-lowest-differential.jsonl"]
    dependencies: [response-determinism-pre-gate]
    estimated_gpu_hours: 0.6
    estimated_storage_gb: 0.05
    failure_behavior: retry

  - task_id: gen-random-controls
    objective: Generate responses for the 20 frozen layer-matched random control conditions (20 x 50 = 1,000 generations, one model load, deterministic B8 chunks).
    definition_of_done: All 20 generation files exist and are non-empty.
    command: [timeout, --kill-after=60, "14400", python, scripts/run_causal_conditions_batched.py, --config, configs/pinned-pro6000-bf16-gen.yaml, --model-path, /models/qwen, --dataset-manifest, datasets/manifests/pilot-lengthmatched.jsonl, --conditions, configs/causal-pilot-conditions.json, --phase, random, --output-dir, "runs/causal-pilot/${RUN_ID}/generations", --summary-dir, "runs/causal-pilot/${RUN_ID}/summaries", --checkpoint-dir, "runs/causal-pilot/${RUN_ID}/checkpoints", --heartbeat-path, "runs/causal-pilot/${RUN_ID}/heartbeat.json", --fingerprint-path, "runs/causal-pilot/${RUN_ID}/environment/fingerprint-random.json", --run-id, "${RUN_ID}"]
    validation_command: [python, -c, "import json,os,sys; spec=json.load(open(sys.argv[1])); phase=sys.argv[2]; d=sys.argv[3]; missing=[c['condition_id'] for c in spec['conditions'] if c['phase']==phase and not (os.path.isfile(os.path.join(d,c['condition_id']+'.jsonl')) and os.path.getsize(os.path.join(d,c['condition_id']+'.jsonl'))>0)]; assert not missing, missing", configs/causal-pilot-conditions.json, random, "runs/causal-pilot/${RUN_ID}/generations"]
    inputs: [configs/causal-pilot-conditions.json, configs/pinned-pro6000-bf16-gen.yaml, datasets/manifests/pilot-lengthmatched.jsonl]
    outputs: ["runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-000.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-001.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-002.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-003.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-004.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-005.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-006.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-007.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-008.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-009.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-010.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-011.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-012.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-013.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-014.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-015.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-016.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-017.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-018.jsonl", "runs/causal-pilot/${RUN_ID}/generations/c3-layer-random-019.jsonl"]
    dependencies: [response-determinism-pre-gate]
    estimated_gpu_hours: 2.4
    estimated_storage_gb: 0.2
    failure_behavior: retry

  - task_id: generation-bundle
    objective: Validate all 26 response artifacts (row counts, sample order, non-empty responses, masked-expert agreement with the frozen spec) and freeze their SHA-256 pins into the generation bundle for the scoring-host hand-off.
    definition_of_done: generation-bundle.json exists with 26 verified file hashes; a verify-mode pass over the same files reports zero mismatches.
    command: [timeout, --kill-after=60, "900", python, scripts/generation_bundle.py, build, --conditions, configs/causal-pilot-conditions.json, --generations-dir, "runs/causal-pilot/${RUN_ID}/generations", --dataset-manifest, datasets/manifests/pilot-lengthmatched.jsonl, --output, "runs/causal-pilot/${RUN_ID}/generation-bundle.json"]
    validation_command: [timeout, --kill-after=60, "600", python, scripts/generation_bundle.py, verify, --bundle, "runs/causal-pilot/${RUN_ID}/generation-bundle.json", --generations-dir, "runs/causal-pilot/${RUN_ID}/generations", --report, "runs/causal-pilot/${RUN_ID}/verify-generation-bundle-self.json"]
    inputs: [configs/causal-pilot-conditions.json, datasets/manifests/pilot-lengthmatched.jsonl]
    outputs: ["runs/causal-pilot/${RUN_ID}/generation-bundle.json"]
    dependencies: [gen-validation-interventions, gen-random-controls]
    estimated_gpu_hours: 0
    estimated_storage_gb: 0.001
    failure_behavior: terminal
