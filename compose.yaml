services:
  reverse-reap:
    build:
      context: .
      args:
        # Linux/amd64 PyTorch 2.7.1 + CUDA 12.8 manifest, verified 2026-09-03.
        BASE_IMAGE: ${REVERSE_REAP_BASE_IMAGE:-pytorch/pytorch@sha256:c16f4c749e2d9e96878875cdf6cc45cddda1d1a36fddd371dd6f2360f1b6e2a2}
    image: reverse-reap:${REVERSE_REAP_IMAGE_TAG:-local}
    ipc: host
    shm_size: 16gb
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16g,exec
      - /opt/uv-cache:size=4g
    volumes:
      - ${REVERSE_REAP_MODEL_DIR:?set model directory}:/models/qwen:ro
      - ${REVERSE_REAP_DATA_DIR:-./datasets}:/workspace/datasets:rw
      - ${REVERSE_REAP_RUN_DIR:-./runs}:/workspace/runs:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 4
              capabilities: [gpu]
    environment:
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    stop_grace_period: 2m
